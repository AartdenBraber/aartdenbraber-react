<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#263238" />

    <!-- Titel en omschrijving hieronder worden na de build per taal opnieuw
         gezet uit src/content; zie scripts/taalpaginas.js. Wat hier staat is de
         Nederlandse versie, zodat de bron niet misleidt. -->
    <title>Aart den Braber - developer | Backend, frontend, test en UX</title>
    <meta name="description" content="Freelance developer uit Nederland. Backend, frontend, test en UX." />

    <!-- max-image-preview:large laat een zoekmachine de hero als groot beeld
         tonen in plaats van als duimnagel. De rest is de standaard, maar dan
         opgeschreven. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- De taal hangt aan het adres: / is Nederlands, /en is Engels. Deze twee
         regels vertellen een zoekmachine welke twee dat zijn. De canonical
         wordt door de taalcontext bijgewerkt zodra er gewisseld wordt. -->
    <link rel="canonical" href="https://aartdenbraber.nl/" />
    <link rel="alternate" hreflang="nl" href="https://aartdenbraber.nl/" />
    <link rel="alternate" hreflang="en" href="https://aartdenbraber.nl/en" />
    <link rel="alternate" hreflang="x-default" href="https://aartdenbraber.nl/" />

    <!-- Zonder deze regels levert de link op LinkedIn of in een chat een kale
         url op, zonder titel, zonder tekst en zonder plaatje. De taalcontext
         werkt ze bij zodra er van taal gewisseld wordt. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aart den Braber" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:url" content="https://aartdenbraber.nl/" />
    <meta property="og:title" content="Aart den Braber - developer | Backend, frontend, test en UX" />
    <meta property="og:description" content="Freelance developer uit Nederland. Backend, frontend, test en UX." />
    <meta property="og:image" content="https://aartdenbraber.nl/images/top-bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/images/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/images/favicon/favicon-16x16.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- De achtergrond van de hero is het eerste wat je ziet, dus die halen we
         vooruit in plaats van te wachten tot het javascript geladen is. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/top-bg.jpg" fetchpriority="high" />

    <!-- Wie ben je, in een vorm die een zoekmachine kan lezen. Alles hier staat
         ook ergens op de site of in het cv; er is niets bij verzonnen, en het
         e-mailadres staat er bewust niet in. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://aartdenbraber.nl/#aart",
            "name": "Aart den Braber",
            "url": "https://aartdenbraber.nl/",
            "jobTitle": "Freelance developer",
            "image": "https://aartdenbraber.nl/images/top-bg.jpg",
            "address": { "@type": "PostalAddress", "addressCountry": "NL" },
            "sameAs": ["https://www.linkedin.com/in/aartdenbraber"],
            "knowsAbout": [
              "Frontend development",
              "Backend development",
              "Angular",
              "TypeScript",
              "Node.js",
              "Java",
              "UX",
              "Accessibility",
              "Testing"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://aartdenbraber.nl/#site",
            "url": "https://aartdenbraber.nl/",
            "name": "Aart den Braber",
            "inLanguage": ["nl-NL", "en"],
            "about": { "@id": "https://aartdenbraber.nl/#aart" },
            "publisher": { "@id": "https://aartdenbraber.nl/#aart" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- Zonder javascript blijft de pagina leeg, en dat geldt ook voor de
         crawlers die geen javascript draaien. Dit is het minimum dat er dan
         nog staat. -->
    <noscript>
      <h1>Aart den Braber</h1>
      <p>Freelance developer uit Nederland. Backend, frontend, test en UX.</p>
      <p>
        Mijn focus ligt op het bouwen van duurzame applicaties: technisch sterk,
        gebruiksvriendelijk en toekomstbestendig.
      </p>
      <p>Deze site heeft JavaScript nodig om het cv te tonen.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
