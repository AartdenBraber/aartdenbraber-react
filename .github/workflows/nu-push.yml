name: nu.nl-push

# Roept elk kwartier https://aartdenbraber.nl/rss/nu-push.php aan. Dat script
# staat alleen op de server, in public_html/rss, en komt niet uit deze repo.
# Eigenlijk hoort het in een cronjob op de server, maar bij AXC staat cron uit,
# voor de gebruiker aartdenbraber en ook voor de reseller erboven. Vandaar dit.
#
# De aanroep gaat met een sleutel in de kop X-Nu-Push-Sleutel, niet in het
# adres, zodat hij niet in de toegangslogs van de server belandt. De sleutel
# staat als repository-secret NU_PUSH_SLEUTEL in GitHub; nu-push.php kent alleen
# de SHA-256 ervan. Zonder geldige sleutel geeft het script 403 en doet het
# niets.
#
# De repo is openbaar en daarmee ook de logs van deze workflow. Daarom komt de
# uitvoer van nu-push.php hier niet in het log; die schrijft het script zelf
# weg in /home/aartdenbraber/nu-push.log.
#
# Twee dingen om te weten over geplande workflows bij GitHub:
# - Ze lopen niet op de minuut. Bij drukte schuiven ze op, en soms vallen ze
#   weg. Rond het hele uur is het het drukst, dus deze draait daar niet.
# - In een openbare repo zet GitHub ze uit na 60 dagen zonder activiteit in de
#   repo. Dan staat er een melding in de Actions-tab met een knop om hem weer
#   aan te zetten; een commit naar main werkt ook.
#
# Na elke run kijkt de workflow of er nog meldingen uitgaan. nu-push.php geeft
# in de kop X-Nu-Push-Laatste-Melding terug wanneer er voor het laatst een
# nieuw artikel bijkwam. Is dat langer dan DREMPEL_DAGEN geleden, of is het
# script al zo lang niet bereikt, dan opent de workflow een issue. Gaat het
# weer goed, dan sluit hij dat issue zelf. Dit vangt niet het geval dat GitHub
# de planning na 60 dagen stillegt, want dan draait er ook geen controle meer.
on:
  schedule:
    # In UTC, maar voor een kwartierritme maakt dat niet uit.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# Nooit twee pushes tegelijk. Loopt er nog een als de volgende aan de beurt is,
# dan wacht die. Afbreken zou een half verstuurde push kunnen geven.
concurrency:
  group: nu-push
  cancel-in-progress: false

# Lezen welke runs gelukt zijn, en een issue openen of sluiten. Verder niets.
permissions:
  actions: read
  issues: write

jobs:
  aanroepen:
    runs-on: ubuntu-latest
    # Twee pogingen van hooguit vier minuten met een halve minuut ertussen.
    timeout-minutes: 10

    steps:
      - name: nu-push.php aanroepen
        id: aanroep
        env:
          SLEUTEL: ${{ secrets.NU_PUSH_SLEUTEL }}
        run: |
          if [ -z "$SLEUTEL" ]; then
            echo "::warning::De secret NU_PUSH_SLEUTEL ontbreekt, dus nu-push.php is niet aangeroepen."
            exit 0
          fi

          antwoord="$RUNNER_TEMP/antwoord"
          koppen="$RUNNER_TEMP/koppen"
          poging=1
          while :; do
            status=$(curl -sS -o "$antwoord" -D "$koppen" -w '%{http_code}' --max-time 240 \
              -H "X-Nu-Push-Sleutel: $SLEUTEL" \
              -A 'aartdenbraber-react nu-push' \
              https://aartdenbraber.nl/rss/nu-push.php)
            grootte=$(wc -c < "$antwoord")
            echo "Poging $poging: status $status, $grootte bytes terug."

            # De rewrite in .htaccess geeft voor een onbekend pad index.html
            # terug met status 200. Daaraan zie je dat het script weg is.
            if grep -q 'id="root"' "$antwoord"; then
              echo "::error::Er kwam index.html terug in plaats van nu-push.php. Staat het script nog in public_html/rss?"
              exit 1
            fi

            # nu-push.php stuurt nooit iets terug: zijn uitvoer gaat naar het
            # log op de server. Een leeg antwoord komt dus van het script zelf.
            if [ "$grootte" -eq 0 ]; then
              case "$status" in
                200)
                  laatste=$(grep -i '^X-Nu-Push-Laatste-Melding:' "$koppen" | tail -n 1 | tr -dc '0-9')
                  if [ -n "$laatste" ]; then
                    echo "Laatste nieuwe artikel: $(TZ=Europe/Amsterdam date -d "@$laatste" '+%-d-%-m-%Y %H:%M')."
                  fi
                  echo "laatste=$laatste" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                403)
                  echo "::error::nu-push.php weigert de sleutel (403). Staat de SHA-256 van NU_PUSH_SLEUTEL in de versie van nu-push.php op de server?"
                  exit 1
                  ;;
                *)
                  echo "::error::nu-push.php gaf status $status. Kijk in /home/aartdenbraber/nu-push.log en in het foutenlog van het domein."
                  exit 1
                  ;;
              esac
            fi

            # Wel inhoud betekent dat er iets voor het script stond, en dan
            # heeft het niet gedraaid. Op 14 november 2026 kwam er zo een keer
            # een pagina van 12 kB terug, waarschijnlijk van de botwering van
            # de hosting (Imunify360), terwijl een run een minuut later gewoon
            # lukte. Daarom nog één poging. Er gaat niets verloren: wat het
            # script nog niet verstuurd heeft, gaat bij de volgende run mee.
            # Alleen de titel van die pagina komt in het log, want dit log is
            # openbaar.
            titel=$(grep -o -i '<title>[^<]*</title>' "$antwoord" | head -n 1 | sed -E 's/<[^>]+>//g' | tr -d '\r\n' | cut -c1-120)
            if [ "$poging" -ge 2 ]; then
              echo "::error::nu-push.php is niet bereikt: status $status met een pagina van $grootte bytes (titel: ${titel:-geen}). Waarschijnlijk houdt de botwering van de hosting het IP-adres van deze runner tegen."
              exit 1
            fi
            echo "::warning::Status $status met een pagina van $grootte bytes (titel: ${titel:-geen}) in plaats van een leeg antwoord. Over een halve minuut nog een keer."
            poging=2
            sleep 30
          done

      # Draait ook als de aanroep mislukte, want juist dan moet hij kijken
      # hoe lang dat al zo is.
      - name: Nagaan of er nog meldingen uitgaan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UITKOMST: ${{ steps.aanroep.outcome }}
          LAATSTE: ${{ steps.aanroep.outputs.laatste }}
          DREMPEL_DAGEN: 7
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titel="nu.nl-push: al $DREMPEL_DAGEN dagen geen nieuwe meldingen"
          datum() { TZ=Europe/Amsterdam date -d "@$1" '+%-d-%-m-%Y %H:%M'; }

          if [ "$UITKOMST" = success ] && [ -n "$LAATSTE" ]; then
            sinds="$LAATSTE"
            reden="nu-push.php draait wel, maar heeft sinds $(datum "$sinds") geen nieuw artikel meer verstuurd. Misschien levert nu-meest-gelezen.php niets nieuws meer op (is de pagina van nu.nl veranderd?), of lukt het versturen naar ntfy niet. Kijk in /home/aartdenbraber/nu-push.log."
          else
            # Het script is nu niet bereikt of gaf geen tijd terug. Dan telt
            # de laatste run waarin het wel lukte. Deze run zelf loopt nog en
            # telt dus niet mee.
            vorige=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nu-push.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].run_started_at // empty')
            if [ -z "$vorige" ]; then
              echo "Er is nog geen geslaagde run, dus er valt niets te vergelijken."
              exit 0
            fi
            sinds=$(date -d "$vorige" +%s)
            reden="nu-push.php is sinds $(datum "$sinds") niet meer goed bereikt. In de mislukte runs van deze workflow staat wat er terugkwam."
          fi

          leeftijd=$(( $(date +%s) - sinds ))
          echo "Laatste teken van leven: $(datum "$sinds"), $(( leeftijd / 3600 )) uur geleden."

          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$titel\") | .number" | head -n 1)

          if [ "$leeftijd" -gt $(( DREMPEL_DAGEN * 86400 )) ]; then
            if [ -n "$open" ]; then
              echo "Issue #$open staat al open."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$titel" \
                --body "$reden

          Gezien in $RUN_URL. Dit issue gaat vanzelf dicht zodra er weer een nieuw artikel verstuurd is."
              echo "::warning::$titel. Er is een issue geopend."
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "Er gaan weer meldingen uit: het laatste nieuwe artikel kwam op $(datum "$sinds"). Gezien in $RUN_URL."
            echo "Issue #$open gesloten."
          fi
