name: Bouwen en uitrollen

# Bij elke push naar main, en met de hand via de Actions-tab. Start je hem met
# de hand, dan kun je een proefrit kiezen: lftp laat dan zien wat hij zou
# uploaden en verwijderen, zonder het te doen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proefrit:
        description: 'Proefrit, alleen tonen wat er zou gebeuren'
        type: boolean
        default: false

# Twee uitrollen tegelijk zouden elkaars bestanden overschrijven.
concurrency:
  group: uitrollen
  cancel-in-progress: false

jobs:
  uitrollen:
    runs-on: ubuntu-latest

    # De servergegevens staan in de environment "public": FTP_PASSWORD als
    # secret, de rest als variables. Zonder deze regel ziet de job er niets
    # van en wordt de uitrol stil overgeslagen.
    environment: public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Types controleren
        run: npx tsc --noEmit

      # CI=true laat Create React App waarschuwingen als fouten behandelen.
      # Er gaat niets naar de server als de tests of de build struikelen.
      - name: Tests draaien
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Bouwen
        run: npm run build
        env:
          CI: true

      # Zolang de servergegevens ontbreken bouwt en test deze workflow wel,
      # maar rolt hij niets uit. Zo is hij groen vanaf de eerste push en gaat
      # hij vanzelf uitrollen zodra ze in de environment staan.
      - name: Nagaan of de servergegevens er zijn
        id: gegevens
        run: |
          if [ -n "${{ vars.FTP_HOST }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "compleet=ja" >> "$GITHUB_OUTPUT"
          else
            echo "compleet=nee" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP_HOST of FTP_PASSWORD ontbreekt nog, dus de uitrol wordt overgeslagen."
          fi

      # De FTPS-server stuurt zijn tussenliggende CA niet mee, dus kan lftp het
      # servercertificaat niet narekenen tegen de rootcertificaten van de
      # runner. deploy/PerfectSSL.pem vult dat gat; die CA komt van DigiCert en
      # loopt tot april 2034. Zonder deze controle is de verbinding wel
      # versleuteld, maar weet je niet met wie je praat.
      #
      # ssl-force en ssl-protect-data laten de uitrol falen als de server
      # onverwacht geen TLS wil, in plaats van stil terug te vallen op klare
      # tekst. list-options -a zorgt dat .htaccess in de listing meekomt.
      - name: lftp en certificaten klaarzetten
        if: steps.gegevens.outputs.compleet == 'ja'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          cat /etc/ssl/certs/ca-certificates.crt deploy/PerfectSSL.pem > "$HOME/ca-bundle.pem"
          cat > "$HOME/.lftprc" <<EOF
          set cmd:fail-exit yes
          set ssl:ca-file $HOME/ca-bundle.pem
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-list yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ftp:use-mlsd yes
          set ftp:list-options -a
          set net:max-retries 3
          set net:timeout 20
          set dns:order inet
          EOF

      # Ligt er een index.html in DEPLOY_PATH? Zo niet, dan wijst die variabele
      # ergens anders naar en stopt de uitrol voordat er iets geschreven wordt.
      #
      # Dit vangt ook het geval waarin DEPLOY_PATH op / staat terwijl het
      # FTP-account niet in de webroot begint maar hoger in de boom.
      - name: Nagaan of DEPLOY_PATH de webroot is
        if: steps.gegevens.outputs.compleet == 'ja'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          cat > "$HOME/controle.lftp" <<EOF
          open --env-password -u "$FTP_USER" "ftp://$FTP_HOST"
          cd "$DEPLOY_PATH"
          cat index.html > /dev/null
          bye
          EOF
          if ! lftp -f "$HOME/controle.lftp"; then
            echo "::error::Geen index.html gevonden in DEPLOY_PATH. Controleer die variabele. De uitrol is gestopt voordat er iets verwijderd werd."
            exit 1
          fi

      # De uitrol raakt alleen aan wat de build zelf maakt.
      #
      # 1. Alles behalve index.html en .htaccess gaat omhoog, zonder iets te
      #    verwijderen. De nieuwe bundels komen naast de oude te staan en de
      #    site draait ondertussen door op de oude index.html.
      # 2. index.html en .htaccess gaan omhoog onder een tijdelijke naam en
      #    worden daarna hernoemd. Hernoemen binnen een map is een enkele
      #    handeling op het bestandssysteem, dus niemand krijgt een half
      #    geschreven bestand te zien. Hier klapt de site om.
      # 3. Opruimen gebeurt alleen in static/. Daar staat uitsluitend wat de
      #    build genereert, met een hash in elke bestandsnaam, dus daar mag
      #    weg wat niet meer in build/ voorkomt.
      #
      # Buiten static/ wordt nooit iets verwijderd. Wat daar staat en niet uit
      # deze repo komt, blijft dus staan. Dat is met opzet: op 3 september 2026
      # ruimde een spiegeling met --delete op de hele webroot alles op wat niet
      # in build/ zat, en dat bleek een stuk meer te zijn dan bedoeld.
      #
      # Struikelt fase 1 of 2, dan staat de oude site er nog compleet bij en is
      # er niets verwijderd, want cmd:fail-exit stopt voor fase 3.
      - name: Uploaden naar de server
        if: steps.gegevens.outputs.compleet == 'ja'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_USER: ${{ vars.FTP_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PROEFRIT: ${{ inputs.proefrit }}
        run: |
          for bestand in build/index.html build/.htaccess; do
            if [ ! -f "$bestand" ]; then
              echo "::error::$bestand ontbreekt in de build, dus de wissel kan niet. Uitrol gestopt."
              exit 1
            fi
          done

          DRY=""
          PUT_HTACCESS="put build/.htaccess -o .htaccess.nieuw"
          PUT_INDEX="put build/index.html -o index.html.nieuw"
          MV_HTACCESS="mv .htaccess.nieuw .htaccess"
          MV_INDEX="mv index.html.nieuw index.html"
          if [ "$PROEFRIT" = "true" ]; then
            DRY="--dry-run"
            PUT_HTACCESS=""
            PUT_INDEX=""
            MV_HTACCESS=""
            MV_INDEX=""
            echo "::notice::Proefrit, er wordt niets geüpload of verwijderd."
            echo "Let op bij het lezen van dit log:"
            echo "- Het omwisselen van index.html en .htaccess staat er niet in. Dat gaat met put en mv, en die kennen geen proefrit."
            echo "- Fase 3 herhaalt de uploads van fase 1, omdat fase 1 nu niet echt gedraaid heeft. In een echte uitrol laat fase 3 alleen nog verwijderingen zien."
          fi

          cat > "$HOME/uitrollen.lftp" <<EOF
          open --env-password -u "$FTP_USER" "ftp://$FTP_HOST"
          echo "== fase 1: alles behalve index.html en .htaccess, zonder opruimen =="
          mirror --reverse --no-perms --verbose $DRY --exclude-glob 'index.html' --exclude-glob '.htaccess' build/ "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          echo "== fase 2: index.html en .htaccess omwisselen =="
          $PUT_HTACCESS
          $PUT_INDEX
          $MV_HTACCESS
          $MV_INDEX
          echo "== fase 3: opruimen, uitsluitend binnen static/ =="
          mirror --reverse --delete --no-perms --verbose $DRY build/static "$DEPLOY_PATH/static"
          bye
          EOF
          lftp -f "$HOME/uitrollen.lftp"

      # De rewrite in .htaccess geeft voor elk onbekend pad index.html terug met
      # status 200. Een statuscode zegt hier dus niets over of een bestand nog
      # bestaat; daarom kijken we naar het inhoudstype. Zonder dat zou deze stap
      # ook groen blijven als het cv van de server verdwenen was.
      - name: Controleren of de site draait
        if: steps.gegevens.outputs.compleet == 'ja' && !inputs.proefrit
        run: |
          echo "Titel op de live site:"
          curl -sS --fail --max-time 20 https://aartdenbraber.nl/ | grep -o '<title>[^<]*</title>'

          echo "Engelse versie:"
          curl -sS --fail --max-time 20 https://aartdenbraber.nl/en | grep -o '<title>[^<]*</title>'

          for bestand in /CV-Aart-den-Braber-NL.pdf /CV-Aart-den-Braber-EN.pdf /pdf.worker.min.js; do
            soort=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "https://aartdenbraber.nl$bestand")
            echo "$bestand -> $soort"
            case "$soort" in
              text/html*)
                echo "::error::$bestand komt terug als HTML. Dat is de fallback, dus het bestand staat niet meer op de server."
                exit 1
                ;;
            esac
          done
