name: Bouwen en uitrollen

# Bij elke push naar main, en met de hand via de Actions-tab. Start je hem met
# de hand, dan kun je een proefrit kiezen: lftp laat dan zien wat hij zou
# uploaden en verwijderen, zonder het te doen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proefrit:
        description: 'Proefrit, alleen tonen wat er zou gebeuren'
        type: boolean
        default: false

# Twee uitrollen tegelijk zouden elkaars bestanden overschrijven.
concurrency:
  group: uitrollen
  cancel-in-progress: false

jobs:
  uitrollen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Types controleren
        run: npx tsc --noEmit

      # CI=true laat Create React App waarschuwingen als fouten behandelen.
      # Er gaat niets naar de server als de tests of de build struikelen.
      - name: Tests draaien
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Bouwen
        run: npm run build
        env:
          CI: true

      # Zolang de servergegevens ontbreken bouwt en test deze workflow wel,
      # maar rolt hij niets uit. Zo is hij groen vanaf de eerste push en gaat
      # hij vanzelf uitrollen zodra de secrets erin staan.
      - name: Nagaan of de servergegevens er zijn
        id: gegevens
        run: |
          if [ -n "${{ secrets.FTP_HOST }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "compleet=ja" >> "$GITHUB_OUTPUT"
          else
            echo "compleet=nee" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP_HOST of FTP_PASSWORD ontbreekt nog, dus de uitrol wordt overgeslagen."
          fi

      # De FTPS-server stuurt zijn tussenliggende CA niet mee, dus kan lftp het
      # servercertificaat niet narekenen tegen de rootcertificaten van de
      # runner. deploy/PerfectSSL.pem vult dat gat; die CA komt van DigiCert en
      # loopt tot april 2034. Zonder deze controle is de verbinding wel
      # versleuteld, maar weet je niet met wie je praat.
      #
      # ssl-force en ssl-protect-data laten de uitrol falen als de server
      # onverwacht geen TLS wil, in plaats van stil terug te vallen op klare
      # tekst. list-options -a zorgt dat .htaccess in de listing meekomt.
      - name: lftp en certificaten klaarzetten
        if: steps.gegevens.outputs.compleet == 'ja'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          cat /etc/ssl/certs/ca-certificates.crt deploy/PerfectSSL.pem > "$HOME/ca-bundle.pem"
          cat > "$HOME/.lftprc" <<EOF
          set cmd:fail-exit yes
          set ssl:ca-file $HOME/ca-bundle.pem
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-list yes
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set ftp:use-mlsd yes
          set ftp:list-options -a
          set net:max-retries 3
          set net:timeout 20
          set dns:order inet
          EOF

      # Laatste zekerheid voor een spiegeling met --delete: ligt er een
      # index.html in DEPLOY_PATH? Zo niet, dan wijst dat secret ergens anders
      # naar en stopt de uitrol voordat er iets verdwijnt.
      - name: Nagaan of DEPLOY_PATH de webroot is
        if: steps.gegevens.outputs.compleet == 'ja'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          cat > "$HOME/controle.lftp" <<EOF
          open --env-password -u "$FTP_USER" "ftp://$FTP_HOST"
          cd "$DEPLOY_PATH"
          cat index.html > /dev/null
          bye
          EOF
          if ! lftp -f "$HOME/controle.lftp"; then
            echo "::error::Geen index.html gevonden in DEPLOY_PATH. Controleer dat secret. De uitrol is gestopt voordat er iets verwijderd werd."
            exit 1
          fi

      # mirror spiegelt build/ naar de webroot. --delete ruimt op de server op
      # wat hier niet meer bestaat, zodat oude gehashte bestanden zich niet
      # opstapelen.
      #
      # .well-known blijft met rust: Let's Encrypt zet daar zijn
      # controlebestanden neer bij het vernieuwen van certificaten, en die
      # komen niet uit deze repo.
      #
      # .htaccess gaat wel mee. Die staat sinds kort in public/, dus een
      # wijziging daaraan hoort ook op de server terecht te komen.
      #
      # --no-perms laat de rechten met rust; die zetten over FTP hoeft hier
      # niet en levert anders alleen foutmeldingen op.
      #
      # DEPLOY_PATH moet precies de webroot van deze site zijn en niets
      # ruimers: alles daarbinnen wat niet in build/ zit, verdwijnt.
      - name: Uploaden naar de server
        if: steps.gegevens.outputs.compleet == 'ja'
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROEFRIT: ${{ inputs.proefrit }}
        run: |
          PROEF=""
          if [ "$PROEFRIT" = "true" ]; then
            PROEF="--dry-run"
            echo "::notice::Proefrit, er wordt niets geüpload of verwijderd."
          fi
          cat > "$HOME/uitrollen.lftp" <<EOF
          open --env-password -u "$FTP_USER" "ftp://$FTP_HOST"
          mirror --reverse --delete --no-perms --verbose $PROEF --exclude-glob '.well-known/' --exclude-glob '.well-known' build/ "$DEPLOY_PATH"
          bye
          EOF
          lftp -f "$HOME/uitrollen.lftp"

      - name: Controleren of de site draait
        if: steps.gegevens.outputs.compleet == 'ja' && !inputs.proefrit
        run: |
          echo "Titel op de live site:"
          curl -sS --fail --max-time 20 https://aartdenbraber.nl/ | grep -o '<title>[^<]*</title>'
          echo "Status van /en (hoort 200 te zijn):"
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 20 https://aartdenbraber.nl/en
          echo "Status van het cv (hoort 200 te zijn):"
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 20 https://aartdenbraber.nl/CV-Aart-den-Braber-NL.pdf
